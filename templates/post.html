{% extends "base.html" %}

{% block content %}
<article class="bg-white min-h-screen pb-20">
    <div class="relative h-[400px] flex items-center justify-center overflow-hidden bg-gray-900">
        
        <div class="absolute inset-0 bg-cover bg-center opacity-50" 
             style="background-image: url('{{ url_for('static', filename='img/blog/' + slug + '.jpg') }}');">
        </div>
        
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cubs-blue/50 to-cubs-blue z-10"></div>
        
        <div class="relative z-20 text-center px-4 max-w-4xl mx-auto mt-16">
            <a href="/blog" class="inline-flex items-center text-cubs-gold font-bold uppercase text-sm mb-6 hover:text-white transition-colors">
                <i class="fas fa-arrow-left mr-2"></i> Back to Insights
            </a>
            <h1 class="font-display text-4xl md:text-6xl font-bold text-white leading-tight mb-4 drop-shadow-lg">{{ title }}</h1>
        </div>
    </div>

    <div class="max-w-3xl mx-auto px-6 -mt-20 relative z-30">
        <div class="bg-white rounded-2xl shadow-2xl p-8 md:p-12 border-t-4 border-cubs-gold">
            <div class="prose prose-lg prose-headings:font-display prose-headings:font-bold prose-headings:text-cubs-blue prose-a:text-cubs-gold hover:prose-a:text-cubs-blue max-w-none">
                {{ content | safe }}
            </div>
            
            <div class="mt-12 pt-8 border-t border-gray-100 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center border border-gray-200">
                        <img src="{{ url_for('static', filename='img/Desert_cubs_logo.png') }}" class="w-8 h-8 object-contain">
                    </div>
                    <div>
                        <p class="font-bold text-cubs-blue text-sm">Desert Cubs Team</p>
                        <p class="text-xs text-gray-500">Academy Staff</p>
                    </div>
                </div>
                <div class="flex space-x-4">
                    <button class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center hover:bg-blue-600 hover:text-white transition-colors"><i class="fab fa-facebook-f"></i></button>
                    <button class="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center hover:bg-green-600 hover:text-white transition-colors"><i class="fab fa-whatsapp"></i></button>
                </div>
            </div>
        </div>
    </div>
</article>
{% endblock %}
