{% extends "base.html" %}

{% block content %}
<section class="min-h-screen bg-cubs-blue flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 cricket-field-pattern opacity-30"></div>
    <div class="relative z-10 text-center px-4">
        <p class="font-display text-9xl md:text-[200px] font-black text-cubs-gold/20 leading-none select-none">404</p>
        <div class="-mt-8 md:-mt-16">
            <h1 class="font-display text-4xl md:text-6xl font-black text-white uppercase mb-4">Wicket Down!</h1>
            <p class="text-gray-300 text-lg mb-8 max-w-md mx-auto">
                The page you're looking for has been run out. Let's get you back to the crease.
            </p>
            <div class="flex flex-wrap gap-4 justify-center">
                <a href="/" class="btn-gold px-8 py-4 rounded-full text-base flex items-center gap-2">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="/#branches" class="border-2 border-white text-white px-8 py-4 rounded-full font-display font-bold text-base uppercase tracking-wider hover:bg-white hover:text-cubs-blue transition-all flex items-center gap-2">
                    <i class="fas fa-map-marker-alt"></i> Find a Centre
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
